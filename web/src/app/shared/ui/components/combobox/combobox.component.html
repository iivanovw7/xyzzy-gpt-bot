<tui-textfield class="combobox" [tuiTextfieldCleaner]="isClearable() && size() !== 's'" [tuiTextfieldSize]="size()">
	<input tuiComboBox [placeholder]="placeholder()" [(ngModel)]="value" />
	<tui-data-list-wrapper [items]="items() | tuiFilterByInput: matcher" *tuiTextfieldDropdown new>
	</tui-data-list-wrapper>
</tui-textfield>
