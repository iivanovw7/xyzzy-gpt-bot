<tui-textfield class="input" [tuiTextfieldSize]="size()">
	@if (isSearch()) {
		<tui-icon tuiTextfieldIconLeft icon="@tui.search"></tui-icon>
	}
	<input
		tuiTextfield
		[disabled]="disabled()"
		[max]="max()"
		[min]="min()"
		[placeholder]="placeholder()"
		[type]="type()"
		[(ngModel)]="value" />
</tui-textfield>
